services:
  web:
    build:
      context: .
      target: backend
    image: sealing-desk:latest
    container_name: sealing-desk-web
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Confirmed chunks and receipts live here, surviving restarts/rebuilds.
      - ./data:/data
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/frontend/dist
      # Pause after each replaced chunk so a real repair stays observable
      # over HTTP (concurrent audits can reliably report REPAIRING). The
      # knob defaults to 0; only abnormal blocks pay the wait.
      REPAIR_CHUNK_DELAY: "0.35"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # One-shot: backend tests -> frontend production build -> HTTP smoke against
  # the running web service. Exits non-zero on the first failure.
  verify:
    build:
      context: .
      target: verify
    image: sealing-desk-verify:latest
    container_name: sealing-desk-verify
    environment:
      BASE_URL: http://web:8000
      # Same persistent directory the web service uses: the smoke run needs
      # to fabricate a missing sealed chunk on disk before repairing it.
      # (Backend tests keep their own temp dir via DATA_DIR defaults.)
      WEB_DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
